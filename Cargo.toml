[workspace]
members = [
    "gagent-core",
    "gagent-llm",
    "gagent-tools",
    "gagent-harness",
    "gagent-ralph",
    "gagent-mcp",
    "gagent-sandbox",
    "gagent-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
gagent-core = { path = "gagent-core" }
gagent-llm = { path = "gagent-llm" }
gagent-tools = { path = "gagent-tools" }
gagent-harness = { path = "gagent-harness" }
gagent-ralph = { path = "gagent-ralph" }
gagent-mcp = { path = "gagent-mcp" }
gagent-sandbox = { path = "gagent-sandbox" }
